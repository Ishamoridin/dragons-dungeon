<svg xmlns="http://www.w3.org/2000/svg" width="288" height="250" viewBox="0 0 288 250" role="img" aria-label="Sovereign of Doom card">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.55" stop-color="#182127"/>
      <stop offset="1" stop-color="#5d6672"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#c7d1da" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#8a97a4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c7d1da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d7dee5"/>
      <stop offset="1" stop-color="#7c8894"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd7a1"/>
      <stop offset="1" stop-color="#b3471c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="282" height="244" rx="16" fill="url(#bg)"/>
  <rect x="3" y="3" width="282" height="244" rx="16" fill="url(#mist)"/>

  <!-- Ornate frame with thorn corners -->
  <g fill="none" stroke="#e9f2f8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="11" width="266" height="228" rx="13" stroke-opacity="0.45" stroke-width="1.6"/>
    <rect x="17" y="17" width="254" height="216" rx="10" stroke-opacity="0.18"/>
    <g stroke-opacity="0.75" stroke-width="1.4">
      <path d="M11 40c0-16 13-29 29-29M277 40c0-16-13-29-29-29M11 210c0 16 13 29 29 29M277 210c0 16-13 29-29 29"/>
      <path d="M20 20l10 4-4 10M268 20l-10 4 4 10M20 230l10-4-4-10M268 230l-10-4 4-10"/>
      <path d="M30 34l6-6M258 34l-6-6M30 216l6 6M258 216l-6 6"/>
    </g>
    <path d="M144 11l5 6-5 6-5-6zM144 227l5 6-5 6-5-6zM11 125l6-5 6 5-6 5zM265 125l6-5 6 5-6 5z" fill="#c7d1da" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- Broken chain ring and ash motes -->
  <g fill="none" stroke="#dbe6ef" stroke-opacity="0.4" stroke-width="1.6">
    <circle cx="144" cy="138" r="70" stroke-dasharray="9 6"/>
    <circle cx="144" cy="138" r="78" stroke-opacity="0.15"/>
  </g>
  <g fill="#e9f2f8">
    <circle cx="70" cy="90" r="1.6" fill-opacity="0.7"/><circle cx="214" cy="80" r="1.3" fill-opacity="0.6"/><circle cx="226" cy="150" r="1.8" fill-opacity="0.5"/>
    <circle cx="62" cy="160" r="1.4" fill-opacity="0.55"/><circle cx="92" cy="200" r="1.2" fill-opacity="0.5"/><circle cx="200" cy="206" r="1.5" fill-opacity="0.5"/>
  </g>

  <!-- Hourglass behind, scythe crescents, crowned skull -->
  <g filter="url(#shadow)">
    <ellipse cx="144" cy="196" rx="60" ry="6" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>
    <!-- hourglass -->
    <g fill="#dbe6ef" fill-opacity="0.22" stroke="#e9f2f8" stroke-opacity="0.5" stroke-width="1.4">
      <path d="M112 76h64l-24 52 24 52h-64l24-52z"/>
      <path d="M118 80h52M118 176h52" stroke-width="3"/>
    </g>
    <path d="M136 128h16l-8 26z" fill="url(#ember)" fill-opacity="0.8"/>
    <!-- scythe crescents -->
    <g fill="none" stroke="url(#bone)" stroke-width="5" stroke-linecap="round">
      <path d="M72 100c-10 36 4 70 36 92"/>
      <path d="M216 100c10 36-4 70-36 92"/>
    </g>
    <g fill="none" stroke="#0a1114" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round">
      <path d="M74 104c-8 32 4 62 32 84M214 104c8 32-4 62-32 84"/>
    </g>
    <!-- skull -->
    <g fill="url(#bone)" stroke="#0a1114" stroke-width="1.2" stroke-linejoin="round">
      <path d="M144 94c-28 0-46 19-46 44 0 15 7 27 18 34v14c0 4 3 7 7 7h42c4 0 7-3 7-7v-14c11-7 18-19 18-34 0-25-18-44-46-44z"/>
      <path d="M126 186h36v8c0 3-2 5-5 5h-26c-3 0-5-2-5-5z"/>
    </g>
    <g fill="#0a1114">
      <ellipse cx="128" cy="138" rx="10" ry="12"/><ellipse cx="160" cy="138" rx="10" ry="12"/>
      <path d="M144 150l-6 14h12z"/>
      <rect x="130" y="188" width="4" height="9" rx="1"/><rect x="138" y="188" width="4" height="9" rx="1"/><rect x="146" y="188" width="4" height="9" rx="1"/><rect x="154" y="188" width="4" height="9" rx="1"/>
    </g>
    <circle cx="128" cy="138" r="3" fill="url(#ember)"/><circle cx="160" cy="138" r="3" fill="url(#ember)"/>
    <!-- crown of thorns -->
    <g fill="none" stroke="#2a3137" stroke-width="3.2" stroke-linecap="round">
      <path d="M100 108c14-10 30-14 44-14s30 4 44 14"/>
      <path d="M104 106l-6-10M118 98l-3-12M134 94l1-12M154 94l-1-12M170 98l3-12M184 106l6-10"/>
    </g>
    <g fill="none" stroke="#dbe6ef" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round">
      <path d="M100 108c14-10 30-14 44-14s30 4 44 14"/>
    </g>
  </g>

  <text x="144" y="38" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">SOVEREIGN</text>
  <text x="144" y="56" text-anchor="middle" fill="#dbe6ef" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="1.5">DOMAIN · DOOM</text>
  <text x="144" y="226" text-anchor="middle" fill="#c7d1da" fill-opacity="0.75" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="2">ALL THINGS END</text>
</svg>
