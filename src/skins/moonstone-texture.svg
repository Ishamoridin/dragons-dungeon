<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><filter id="surface" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.009" numOctaves="4" seed="9" stitchTiles="stitch" result="height"/>
    
    <feDiffuseLighting in="height" surfaceScale="2" diffuseConstant="1" lighting-color="#f6f0ff" result="diffuse"><feDistantLight azimuth="150" elevation="55"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2" specularConstant="0.8" specularExponent="30" lighting-color="#f6f0ff" result="specular"><feDistantLight azimuth="150" elevation="40"/></feSpecularLighting>
    <feFlood flood-color="#5b4f8c" result="base"/>
    <feBlend in="base" in2="diffuse" mode="multiply" result="shaded"/>
    <feComposite in="specular" in2="shaded" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter></defs><rect width="512" height="512" fill="#000"/><rect width="512" height="512" fill="#fff" filter="url(#surface)"/><defs><linearGradient id="iris" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff9ad5" stop-opacity="0.18"/><stop offset="0.35" stop-color="#9ad6ff" stop-opacity="0.16"/><stop offset="0.7" stop-color="#c8ff9a" stop-opacity="0.12"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0.18"/></linearGradient></defs><rect width="512" height="512" fill="url(#iris)"/><g fill="#fff"><circle cx="90" cy="130" r="1.6" fill-opacity="0.5"/><circle cx="380" cy="60" r="1.2" fill-opacity="0.4"/><circle cx="430" cy="370" r="1.8" fill-opacity="0.5"/><circle cx="200" cy="430" r="1.3" fill-opacity="0.4"/></g>
</svg>
