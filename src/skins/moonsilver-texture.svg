<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><filter id="surface" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 1.1" numOctaves="3" seed="8" stitchTiles="stitch" result="height"/>
    
    <feDiffuseLighting in="height" surfaceScale="1.1" diffuseConstant="1" lighting-color="#e4ecff" result="diffuse"><feDistantLight azimuth="20" elevation="48"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="1.1" specularConstant="1.3" specularExponent="22" lighting-color="#e4ecff" result="specular"><feDistantLight azimuth="20" elevation="33"/></feSpecularLighting>
    <feFlood flood-color="#9aa3b4" result="base"/>
    <feBlend in="base" in2="diffuse" mode="multiply" result="shaded"/>
    <feComposite in="specular" in2="shaded" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter></defs><rect width="512" height="512" fill="#000"/><rect width="512" height="512" fill="#fff" filter="url(#surface)"/><defs><radialGradient id="moon" cx="78%" cy="18%" r="40%"><stop offset="0" stop-color="#f4f8ff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#dfe8ff" stop-opacity="0.12"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/></radialGradient></defs><rect width="512" height="512" fill="url(#moon)"/><rect width="512" height="512" fill="#0b1020" fill-opacity="0.42"/>
</svg>
