<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><filter id="surface" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="5" seed="3" stitchTiles="stitch" result="height"/>
    
    <feDiffuseLighting in="height" surfaceScale="1.4" diffuseConstant="0.9" lighting-color="#ffffff" result="diffuse"><feDistantLight azimuth="120" elevation="55"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="1.4" specularConstant="0.9" specularExponent="40" lighting-color="#ffffff" result="specular"><feDistantLight azimuth="120" elevation="40"/></feSpecularLighting>
    <feFlood flood-color="#1a1622" result="base"/>
    <feBlend in="base" in2="diffuse" mode="multiply" result="shaded"/>
    <feComposite in="specular" in2="shaded" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter></defs><rect width="512" height="512" fill="#000"/><rect width="512" height="512" fill="#fff" filter="url(#surface)"/><g fill="#fff" fill-opacity="0.06"><circle cx="80" cy="120" r="9"/><circle cx="400" cy="70" r="5"/><circle cx="300" cy="420" r="12"/><circle cx="150" cy="330" r="4"/><circle cx="460" cy="300" r="7"/></g><g fill="none" stroke="#000" stroke-opacity="0.5"><path d="M40 90l60 44 28 80M330 20l44 76 80 36M180 400l80-60 100 16"/></g>
</svg>
