<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><filter id="surface" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.05 0.05" numOctaves="5" seed="27" stitchTiles="stitch" result="height"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="31" stitchTiles="stitch" result="pits"/><feComposite in="height" in2="pits" operator="arithmetic" k1="0" k2="0.8" k3="0.2" k4="0" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="4.5" diffuseConstant="1.2" lighting-color="#ffe2c8" result="diffuse"><feDistantLight azimuth="135" elevation="40"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="4.5" specularConstant="0.2" specularExponent="10" lighting-color="#ffe2c8" result="specular"><feDistantLight azimuth="135" elevation="25"/></feSpecularLighting>
    <feFlood flood-color="#9a4f22" result="base"/>
    <feBlend in="base" in2="diffuse" mode="multiply" result="shaded"/>
    <feComposite in="specular" in2="shaded" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter></defs><rect width="512" height="512" fill="#000"/><rect width="512" height="512" fill="#fff" filter="url(#surface)"/><defs><filter id="patch" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0 0.05  2 0 0 -0.9 0"/></filter></defs><rect width="512" height="512" filter="url(#patch)"/><g fill="#1a0e08" fill-opacity="0.7"><circle cx="90" cy="140" r="3"/><circle cx="420" cy="90" r="4.5"/><circle cx="300" cy="380" r="2.5"/><circle cx="160" cy="430" r="3.5"/><circle cx="470" cy="300" r="2"/></g><g fill="#e59a4a" fill-opacity="0.35"><circle cx="230" cy="110" r="14"/><circle cx="60" cy="360" r="10"/><circle cx="400" cy="460" r="18"/></g>
</svg>
