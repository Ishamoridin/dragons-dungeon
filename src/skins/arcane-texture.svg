<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><filter id="surface" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 1.6" numOctaves="3" seed="19" stitchTiles="stitch" result="height"/>
    
    <feDiffuseLighting in="height" surfaceScale="0.8" diffuseConstant="0.9" lighting-color="#cfe4ff" result="diffuse"><feDistantLight azimuth="0" elevation="45"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="0.8" specularConstant="1.1" specularExponent="30" lighting-color="#cfe4ff" result="specular"><feDistantLight azimuth="0" elevation="30"/></feSpecularLighting>
    <feFlood flood-color="#2a3b5c" result="base"/>
    <feBlend in="base" in2="diffuse" mode="multiply" result="shaded"/>
    <feComposite in="specular" in2="shaded" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter></defs><rect width="512" height="512" fill="#000"/><rect width="512" height="512" fill="#fff" filter="url(#surface)"/><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="512" height="512" fill="#06101f" fill-opacity="0.45"/><g fill="none" stroke="#6ec0ff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" filter="url(#glow)"><path d="M40 40h130v90h90M260 130v130h-110M150 260v130h190v-90M340 300h130M430 40v130h-90M40 430h90v-90M470 470h-60v-60"/><circle cx="170" cy="40" r="4"/><circle cx="340" cy="390" r="4"/><circle cx="40" cy="430" r="4"/><circle cx="470" cy="300" r="4"/><circle cx="430" cy="40" r="4"/></g><g fill="none" stroke="#9cd5ff" stroke-opacity="0.35" stroke-width="0.8"><circle cx="256" cy="256" r="120" stroke-dasharray="4 8"/><circle cx="256" cy="256" r="150"/></g>
</svg>
