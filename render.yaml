# Render Blueprint for the Dragon's Dungeon API (the Express/MongoDB backend behind the GitHub Pages frontend).
# In Render: New + > Blueprint > select this repository > Render reads this file automatically.
# Fields marked "sync: false" are secrets/config Render will prompt you for instead of storing here.
services:
  - type: web
    name: dragons-dungeon-api
    runtime: node
    plan: free
    buildCommand: npm ci
    # npm ci runs scripts/render-prepare.mjs, which builds the frontend here (RENDER=true), so this one service serves
    # the whole app at its root as well as the API. Set SERVE_STATIC_DIR=off to make it API-only again.
    startCommand: npm start
    # Render routes traffic only after this returns 200, which happens once the API has connected to MongoDB.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the GitHub Pages origin exactly (no trailing slash) so CORS and cookies are accepted.
      - key: APP_ORIGIN
        value: https://ishamoridin.github.io
      - key: CROSS_SITE_COOKIES
        value: 'true'
      - key: MONGODB_URI
        sync: false
      # Render's outbound IPs are not fixed on the free plan, so the Atlas cluster's Network Access list must allow
      # 0.0.0.0/0 (or Render's published static IPs on paid plans). Otherwise the API exits on boot with a
      # server selection timeout after about 15 seconds.
      - key: MONGODB_DB_NAME
        value: dragons_dungeon
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: ENCRYPTION_KEY
        sync: false
      - key: INITIAL_DM_USERNAME
        sync: false
      - key: INITIAL_DM_PASSWORD
        sync: false
      - key: INITIAL_PLAYER_USERNAME
        sync: false
      - key: INITIAL_PLAYER_PASSWORD
        sync: false
      # Leave these three blank/unset if you are not wiring up Google sign-in.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional. Service account key JSON (raw or base64) that lets the API read private Google Sheets and write
      # character changes back to them. Share each linked sheet with the account's client_email as an Editor.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Optional. How often linked characters are re-checked against their sheets, in milliseconds (default 86400000, one day).
      - key: SHEET_SYNC_INTERVAL_MS
        sync: false
